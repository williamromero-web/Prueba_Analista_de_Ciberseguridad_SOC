# ===========================================================================
#  Levanta el entorno de demostración con un solo comando:
#     JWT_SECRET=$(openssl rand -hex 24) docker compose up -d --build
#  También sirve exportar la variable o dejarla en un archivo .env, que el
#  repositorio ya ignora.
# ===========================================================================
version: '3.8'

services:
  fleetsec-app:
    build: .
    container_name: fleetsec-api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=staging
      # El secreto llega desde el entorno y no se guarda en el repositorio.
      # Si la variable no esta definida, el arranque se detiene con un aviso.
      - JWT_SECRET=${JWT_SECRET:?Defina JWT_SECRET en el entorno o en .env}
      - PORT=3000
    restart: unless-stopped
