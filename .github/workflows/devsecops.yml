name: Pipeline DevSecOps - FleetSec

# ===========================================================================
#  Pipeline de seguridad de la aplicación.
#  Etapas: busqueda de secretos, análisis de código, análisis de dependencias
#  con inventario de componentes, revisión del contenedor y la infraestructura,
#  escaneo dinámico de la API y el informe consolidado.
#
#  Cada etapa deja su reporte en formato JSON antes de decidir si detiene la
#  integración. Así el informe final puede armarse con el panorama completo
#  aunque una etapa haya fallado, y la condición que bloquea queda escrita de
#  forma explícita en su propio paso en lugar de esconderse en un parámetro
#  de la herramienta.
#
#  Para mantener la ejecución por debajo de 15 minutos:
#    - Las etapas de análisis corren en paralelo.
#    - Se guarda en cache la instalación de las herramientas.
#    - Cada escaner revisa solo la carpeta que le corresponde y se deja fuera
#      el código vulnerable de referencia.
#
#  Las acciones de terceros se encuentran por su identificador exacto de versión
#  para evitar que cualquier cambio en el origen altere el comportamiento.
# ===========================================================================

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Ejecución a mano, para poder lanzar el modo de demostración sin ensuciar
  # el resultado de la rama principal.
  workflow_dispatch:
    inputs:
      incluir_baseline:
        description: >-
          Incluir la versión vulnerable de referencia en el alcance.
          Las puertas se disparan y la ejecución termina en rojo a propósito.
        type: boolean
        default: false

# Cancela ejecuciones anteriores de la misma rama para no gastar minutos.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Interruptor único que leen todas las etapas. En un empujón o en una
  # solicitud de cambios la entrada no existe, así que queda en falso y el
  # alcance es el normal: solo la aplicación corregida.
  INCLUIR_BASELINE: ${{ inputs.incluir_baseline == true }}

jobs:
  # =========================================================================
  # 1. SECRETOS. Busca claves de nube, secretos de sesión y contraseñas.
  # =========================================================================
  secrets-scanning:
    name: Secretos - Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar la configuración del detector
        # La configuración efectiva se deriva de la real en lugar de mantener
        # un segundo archivo, que acabaría desincronizándose. En modo de
        # demostración se borra solo la línea que excluye la carpeta de la
        # versión vulnerable; el resto de reglas y exclusiones quedan igual.
        run: |
          cp .gitleaks.toml gitleaks-efectivo.toml
          if [ "$INCLUIR_BASELINE" = "true" ]; then
            sed -i "/'''_vulnerable_baseline'''/d" gitleaks-efectivo.toml
            echo "Modo de demostración: la versión vulnerable entra en el alcance."
          fi
          echo "=== exclusiones efectivas ==="
          sed -n '/^paths = \[/,/^\]/p' gitleaks-efectivo.toml

      - name: Ejecutar el detector de secretos
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.18.1/gitleaks_8.18.1_linux_x64.tar.gz
          tar -xzf gitleaks_8.18.1_linux_x64.tar.gz
          # Se revisa el árbol de trabajo actual, no el historial. La
          # herramienta escribe el reporte y luego devuelve un código de
          # error si encontró algo, así que el archivo queda disponible igual.
          ./gitleaks detect --no-git --source . --config gitleaks-efectivo.toml \
            --report-format json --report-path gitleaks-report.json -v

      - name: Publicar el reporte de secretos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore

  # =========================================================================
  # 2. ANALISIS DE CODIGO. Reglas oficiales más las propias. No se permite
  #    ningún hallazgo alto o crítico.
  # =========================================================================
  sast-semgrep:
    name: Análisis de código - Semgrep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache de dependencias
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-semgrep-${{ runner.os }}

      - name: Instalar la herramienta
        run: pip install --quiet semgrep

      - name: Definir el alcance del análisis
        run: |
          if [ "$INCLUIR_BASELINE" = "true" ]; then
            echo "ALCANCE=app/ _vulnerable_baseline/" >> "$GITHUB_ENV"
            echo "Modo de demostración: la versión vulnerable entra en el alcance."
          else
            echo "ALCANCE=app/" >> "$GITHUB_ENV"
          fi

      - name: Analizar el código de la aplicación
        # Se recogen todas las severidades para que el informe consolidado
        # tenga el panorama completo. La condición que detiene la integración
        # se evalúa aparte, sobre este mismo reporte.
        #
        # $ALCANCE va sin comillas a propósito: en modo de demostración lleva
        # dos rutas y el intérprete debe separarlas en dos argumentos.
        run: |
          echo "Alcance del análisis: $ALCANCE"
          # shellcheck disable=SC2086
          semgrep scan $ALCANCE \
            --config auto \
            --config .semgrep/custom-rules.yml \
            --json --output semgrep-report.json

      - name: Publicar el reporte de análisis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.json
          if-no-files-found: ignore

      - name: Detener la integración ante hallazgos altos o críticos
        # Los hallazgos de nivel ERROR son los que bloquean. Los medios y bajos
        # quedan en el reporte como información para revisar después.
        run: |
          ERRORES=$(jq '[.results[] | select(.extra.severity == "ERROR")] | length' semgrep-report.json)
          echo "Hallazgos de nivel ERROR: $ERRORES"
          if [ "$ERRORES" -gt 0 ]; then
            jq -r '.results[] | select(.extra.severity == "ERROR")
                   | "  - \(.check_id) en \(.path):\(.start.line)"' semgrep-report.json
            echo "El análisis de código detuvo la integración."
            exit 1
          fi

  # =========================================================================
  # 3. DEPENDENCIAS E INVENTARIO. Detiene el pipeline según el puntaje de la
  #    falla y genera el inventario de componentes.
  # =========================================================================
  sca-trivy:
    name: Dependencias e inventario - Trivy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Se ejecuta la herramienta desde su imagen oficial para no depender del
      # instalador ni de la accion. La versión queda fijada.
      - name: Revisar las dependencias
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work aquasec/trivy:0.72.0 \
            fs --scanners vuln --ignore-unfixed \
            --format json --output trivy-fs-report.json app/

      - name: Revisar las dependencias de la versión vulnerable
        # Solo en modo de demostración. Esa carpeta conserva el archivo de
        # bloqueo anterior a la corrección, con fallas conocidas de puntaje
        # alto. Se analiza aparte porque la herramienta acepta una sola ruta
        # por ejecución.
        if: env.INCLUIR_BASELINE == 'true'
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work aquasec/trivy:0.72.0 \
            fs --scanners vuln --ignore-unfixed \
            --format json --output trivy-fs-baseline-report.json \
            _vulnerable_baseline/app/

      - name: Publicar el reporte de dependencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-report
          path: |
            trivy-fs-report.json
            trivy-fs-baseline-report.json
          if-no-files-found: ignore

      - name: Detener ante fallas con puntaje alto
        # La política exige bloquear un puntaje de 8.0 o más en una dependencia
        # directa, y de 9.0 o más en una indirecta. Cuando la herramienta no
        # informa la relación se asume directa, que es el criterio más estricto.
        run: |
          : > dependencias-bloqueantes.txt
          for reporte in trivy-fs-report.json trivy-fs-baseline-report.json; do
            [ -f "$reporte" ] || continue
            jq -r --arg origen "$reporte" '
              [ .Results[]?.Vulnerabilities[]?
                | { id: .VulnerabilityID,
                    paquete: .PkgName,
                    relacion: (.Relationship // "direct"),
                    puntaje: ([.CVSS[]?.V3Score] | max // 0) }
                | select( (.relacion == "indirect" and .puntaje >= 9.0)
                          or (.relacion != "indirect" and .puntaje >= 8.0) ) ]
              | .[] | "  - \(.id) en \(.paquete) (\(.relacion), CVSS \(.puntaje)) [\($origen)]"
            ' "$reporte" >> dependencias-bloqueantes.txt
          done

          cat dependencias-bloqueantes.txt
          if [ -s dependencias-bloqueantes.txt ]; then
            echo "Las dependencias detuvieron la integración por superar el puntaje permitido."
            exit 1
          fi
          echo "Ninguna dependencia supera el puntaje permitido."

      - name: Generar el inventario de componentes
        if: success()
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work aquasec/trivy:0.72.0 \
            fs --format cyclonedx --output sbom-cyclonedx.json app/

      - name: Publicar el inventario
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom-cyclonedx.json
          if-no-files-found: ignore

  # =========================================================================
  # 4. CONTENEDOR E INFRAESTRUCTURA. Revisa el Dockerfile, la imagen ya
  #    construida y el código de infraestructura. Los tres escaneos corren
  #    completos y al final un solo paso decide si se detiene la integración.
  # =========================================================================
  container-iac:
    name: Contenedor e infraestructura
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Revisar el Dockerfile
        # DL3006 se eleva a error para que una imagen base sin versión fija
        # detenga la integración, tal como exige la política.
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: ./app/Dockerfile
          format: json
          output-file: hadolint-report.json
          override-error: DL3006
          no-fail: true

      - name: Revisar el Dockerfile de la versión vulnerable
        # Solo en modo de demostración. Esa versión declara la imagen base sin
        # fijar la versión, que es justamente lo que DL3006 detiene.
        if: env.INCLUIR_BASELINE == 'true'
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: ./_vulnerable_baseline/app/Dockerfile
          format: json
          output-file: hadolint-baseline-report.json
          override-error: DL3006
          no-fail: true

      - name: Construir la imagen
        run: docker build -t fleetsec-app:ci ./app

      - name: Revisar la imagen
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$GITHUB_WORKSPACE:/work" -w /work aquasec/trivy:0.72.0 \
            image --ignore-unfixed \
            --format json --output trivy-image-report.json fleetsec-app:ci

      - name: Construir y revisar la imagen de la versión vulnerable
        # Solo en modo de demostración. Esa imagen instala las dependencias
        # anteriores a la corrección, corre como root y conserva las
        # herramientas de construcción, así que la revisión encuentra fallas
        # críticas y la puerta se dispara.
        if: env.INCLUIR_BASELINE == 'true'
        run: |
          docker build -t fleetsec-app:vulnerable ./_vulnerable_baseline/app
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$GITHUB_WORKSPACE:/work" -w /work aquasec/trivy:0.72.0 \
            image --ignore-unfixed \
            --format json --output trivy-image-baseline-report.json \
            fleetsec-app:vulnerable

      - name: Cache de dependencias
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-checkov-${{ runner.os }}

      - name: Revisar la infraestructura
        run: |
          pip install --quiet "checkov>=3.2,<4"
          # Se pide el resultado por la salida estándar y no se detiene aquí,
          # porque la decisión se toma más abajo junto con los otros escaneos.
          checkov --directory infrastructure/ --output json --soft-fail \
            > checkov-report.json

      - name: Publicar los reportes del contenedor y la infraestructura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-iac-report
          path: |
            hadolint-report.json
            hadolint-baseline-report.json
            trivy-image-report.json
            trivy-image-baseline-report.json
            checkov-report.json
          if-no-files-found: ignore

      - name: Detener la integración según los tres escaneos
        run: |
          # Checkov puede devolver un objeto o una lista de objetos, uno por
          # marco de trabajo analizado. Se contemplan las dos formas.
          CONTROLES_FALLIDOS='[ (if type == "array" then .[] else . end)
                                | .results.failed_checks[]? ]'

          # En modo de demostración hay dos reportes del Dockerfile, el de la
          # aplicación y el de la versión vulnerable. Se suman los errores de
          # todos los que existan.
          DOCKERFILE=0
          for reporte in hadolint-report.json hadolint-baseline-report.json; do
            if [ -f "$reporte" ]; then
              ERRORES=$(jq '[.[] | select(.level == "error")] | length' "$reporte")
              DOCKERFILE=$((DOCKERFILE + ERRORES))
              if [ "$ERRORES" -gt 0 ]; then
                jq -r '.[] | select(.level == "error")
                       | "  - \(.code) en \(.file):\(.line) \(.message)"' "$reporte"
              fi
            fi
          done
          # Igual que con el Dockerfile, en modo de demostración hay dos
          # reportes de imagen: la de la aplicación y la vulnerable.
          IMAGEN=0
          for reporte in trivy-image-report.json trivy-image-baseline-report.json; do
            if [ -f "$reporte" ]; then
              CRITICAS=$(jq '[.Results[]?.Vulnerabilities[]?
                              | select(.Severity == "CRITICAL")] | length' "$reporte")
              IMAGEN=$((IMAGEN + CRITICAS))
              if [ "$CRITICAS" -gt 0 ]; then
                jq -r '.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")
                       | "  - \(.VulnerabilityID) en \(.PkgName) \(.InstalledVersion)"' \
                  "$reporte" | sort -u | head -20
              fi
            fi
          done
          INFRA=$(jq "$CONTROLES_FALLIDOS | length" checkov-report.json)
          PUERTOS=$(jq "$CONTROLES_FALLIDOS
                        | map(select(.check_id == \"CKV_AWS_24\"
                                     or .check_id == \"CKV_AWS_25\"))
                        | length" checkov-report.json)

          echo "Dockerfile, errores: $DOCKERFILE"
          echo "Imagen, fallas críticas: $IMAGEN"
          echo "Infraestructura, controles incumplidos: $INFRA (de administración expuestos: $PUERTOS)"

          if [ "$PUERTOS" -gt 0 ]; then
            jq -r "$CONTROLES_FALLIDOS
                   | .[] | select(.check_id == \"CKV_AWS_24\" or .check_id == \"CKV_AWS_25\")
                   | \"  - \(.check_id) en \(.resource)\"" checkov-report.json
            echo "Hay un grupo de seguridad que abre un puerto de administración a Internet."
          fi

          if [ "$DOCKERFILE" -gt 0 ] || [ "$IMAGEN" -gt 0 ] || [ "$INFRA" -gt 0 ]; then
            echo "La revisión del contenedor y la infraestructura detuvo la integración."
            exit 1
          fi
          echo "El contenedor y la infraestructura cumplen la política."

  # =========================================================================
  # 5. ESCANEO DINAMICO. Recorre la API con un token de sesión válido.
  #    Los hallazgos altos detienen el pipeline y los medios abren un caso
  #    de seguimiento etiquetado.
  # =========================================================================
  dast-zap:
    name: Escaneo dinámico - OWASP ZAP
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Levantar la aplicación en un entorno de pruebas
        # En modo de demostración se levanta la versión vulnerable en lugar de
        # la corregida, para que el recorrido de la API encuentre las fallas
        # reales y la puerta se dispare.
        run: |
          if [ "$INCLUIR_BASELINE" = "true" ]; then
            echo "Modo de demostración: se levanta la versión vulnerable."
            docker build -t fleetsec-app:ci ./_vulnerable_baseline/app
            # Esa versión lleva el secreto escrito en el código y no lee
            # ninguna variable de entorno.
            docker run -d --network host --name app fleetsec-app:ci
          else
            docker build -t fleetsec-app:ci ./app
            docker run -d --network host --name app \
              -e JWT_SECRET=super_secret_key_ci_solo_para_pruebas fleetsec-app:ci
          fi
          # Se espera a que el servidor conteste, sea cual sea el código. La
          # versión corregida responde 200 en la raíz y la vulnerable devuelve
          # 404 porque no define esa ruta; en los dos casos el servidor ya está
          # levantado, que es lo único que hace falta comprobar aquí.
          CODIGO=000
          for i in $(seq 1 30); do
            CODIGO=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/ 2>/dev/null || echo 000)
            if [ "$CODIGO" != "000" ]; then
              echo "aplicación disponible, responde con el código $CODIGO"
              break
            fi
            sleep 2
          done
          echo "=== estado de los contenedores ==="; docker ps -a
          echo "=== registros de la aplicación ==="; docker logs app || true
          if [ "$CODIGO" = "000" ]; then
            echo "La aplicación no responde en el puerto 3000"
            exit 1
          fi

      - name: Generar un token de sesión para las pruebas
        run: |
          if [ "$INCLUIR_BASELINE" = "true" ]; then
            # La versión vulnerable firma con el secreto que lleva escrito.
            TOKEN=$(docker exec app node -e "console.log(require('jsonwebtoken').sign({id:1,role:'admin'},'super_secret_key',{algorithm:'HS256'}))")
          else
            TOKEN=$(docker exec app node -e "console.log(require('jsonwebtoken').sign({id:1,role:'admin'},process.env.JWT_SECRET,{algorithm:'HS256'}))")
          fi
          echo "::add-mask::$TOKEN"
          echo "ZAP_JWT_TOKEN=$TOKEN" >> $GITHUB_ENV

      - name: Escanear la API con sesión iniciada
        run: |
          # Se dan permisos de escritura para que el contenedor del escaner
          # pueda dejar el reporte en el espacio de trabajo.
          sudo chmod -R a+rwX "$GITHUB_WORKSPACE"
          docker run --network host -v "$GITHUB_WORKSPACE":/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable zap-api-scan.py \
            -t /zap/wrk/app/openapi.yaml -f openapi \
            -c /zap/wrk/.zap/rules.tsv \
            -J report_json.json -r report_html.html \
            -z "-config replacer.full_list(0).description=auth \
                -config replacer.full_list(0).enabled=true \
                -config replacer.full_list(0).matchtype=REQ_HEADER \
                -config replacer.full_list(0).matchstr=Authorization \
                -config replacer.full_list(0).replacement=Bearer ${ZAP_JWT_TOKEN}" \
            || true
          test -f report_json.json || { echo "El escaner no genero el reporte"; exit 1; }

      - name: Publicar el reporte del escaneo dinámico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: |
            report_json.json
            report_html.html
          if-no-files-found: ignore

      - name: Revisar los hallazgos y decidir si se detiene la integración
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let high = 0, medium = 0;
            const rep = JSON.parse(fs.readFileSync('report_json.json', 'utf8'));
            for (const site of rep.site || []) {
              for (const a of site.alerts || []) {
                if (a.riskcode === '3') high++;
                else if (a.riskcode === '2') medium++;
              }
            }
            core.info(`Resultado del escaneo dinámico: altos ${high}, medios ${medium}`);
            if (medium > 0) {
              // Si ya hay un caso abierto por hallazgos medios, se agrega un
              // comentario en lugar de abrir uno nuevo en cada ejecución.
              const abiertos = await github.rest.issues.listForRepo({
                owner: context.repo.owner, repo: context.repo.repo,
                state: 'open', labels: 'security/medium'
              });
              const caso = abiertos.data.find(i => i.title.startsWith('[DAST]'));
              const texto = `El escaneo dinámico reportó ${medium} alerta de severidad media en la rama principal. Revisar el reporte adjunto de la ejecución número ${context.runNumber}.`;
              if (caso) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: caso.number, body: texto
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner, repo: context.repo.repo,
                  title: `[DAST] Hallazgos de severidad media detectados por el escaneo dinámico`,
                  labels: ['security/medium'], body: texto
                });
              }
            }
            if (high > 0) {
              core.setFailed(`El escaneo dinámico detuvo la integración por ${high} hallazgo de severidad alta.`);
            }

  # =========================================================================
  # 6. INFORME CONSOLIDADO. Reúne la salida en formato JSON de todas las
  #    etapas y arma un documento en PDF legible, con la misma presentación
  #    del informe ejecutivo del análisis de vulnerabilidades. También publica
  #    el cuadro resumen en el panel de la ejecución.
  # =========================================================================
  reporte-consolidado:
    name: Informe consolidado
    runs-on: ubuntu-latest
    needs: [secrets-scanning, sast-semgrep, sca-trivy, container-iac, dast-zap]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar el intérprete
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar las dependencias del generador
        run: pip install --quiet -r scripts/requirements.txt

      - name: Descargar los reportes de todas las etapas
        uses: actions/download-artifact@v4
        with:
          path: artefactos

      - name: Generar el informe
        # El resultado de cada etapa se pasa como parámetro para que el
        # documento muestre cuál fue la que detuvo la integración.
        run: |
          if [ "$INCLUIR_BASELINE" = "true" ]; then
            MARCA="--demostracion"
          else
            MARCA=""
          fi
          # shellcheck disable=SC2086
          python scripts/generar_reporte_seguridad.py \
            $MARCA \
            --artefactos artefactos \
            --salida informe-seguridad-fleetsec.pdf \
            --resumen resumen-seguridad.md \
            --etapa secretos=${{ needs.secrets-scanning.result }} \
            --etapa sast=${{ needs.sast-semgrep.result }} \
            --etapa sca=${{ needs.sca-trivy.result }} \
            --etapa contenedor=${{ needs.container-iac.result }} \
            --etapa dast=${{ needs.dast-zap.result }}

      - name: Publicar el informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-seguridad-pdf
          path: informe-seguridad-fleetsec.pdf
          if-no-files-found: warn

      - name: Mostrar el resumen en el panel de la ejecución
        if: always()
        run: cat resumen-seguridad.md >> "$GITHUB_STEP_SUMMARY"
